[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "QCS"
version = "0.1.0"
description = "Simple QCS"
dependencies = [
    "numpy==2.3.4",
    "pillow==12.1.0",
    "matplotlib==3.10.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
shors_algorithm = "qcs.shors_algorithm:interactive_shors_algorithm"
